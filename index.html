<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SilenX</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <h1>SilenX</h1>
        <p class="subtitle">
            AI Speech Detection System
        </p>

        <div class="upload-box">
        
            <input type="file" id="videoInput" accept="video/*">
        
            <p id="fileName">
                No file selected
            </p>
        
            <button id="analyzeBtn">
                <span id="analyzeText">
                    Start Analysis
                </span>
            
                <span id="loader" class="loader"></span>
            </button>
        
        </div>

        <div class="status-box">
            <h2>Status</h2>
            <p id="status">
                Starting...
            </p>
        </div>

        <br>
        
        <div class="setting-item">
            <label>
                Confidence:
                <span id="confidenceValue">0.7</span>
            </label>
        <div>
        
        <input type="range" id="confidenceSlider" min="0.1" max="1.0" step="0.1" value="0.7">
        
        <div class="setting-item">
            <label>
                Padding:
                <span id="paddingValue">200</span> ms
            </label>
        <div>
        
        <input type="range" id="paddingSlider" min="0" max="1000" step="50" value="200">

        <button id="downloadBtn" disabled>
            Download SRT
        </button>

    </main>


    <!-- Cross Origin Isolation -->
    <script src="coi-serviceworker.js"></script>

    <!-- ONNX Runtime -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>

    <!-- FFmpeg -->
    <script src="js/ffmpeg.min.js"></script>

    <!-- Main App -->
    <script src="js/app.js"></script>

</body>

</html>
